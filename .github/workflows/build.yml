name: Build Hello World

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile
        run: |
          gcc hello.c -o hello

      - name: Show files
        run: |
          ls -lh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hello-binary
          path: hello
