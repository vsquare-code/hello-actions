name: Build Hello World

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION"

      - name: Compile
        run: |
          gcc hello.c -o hello

      - name: Show files
        run: |
          ls -lh
          file hello

      - name: Create archive
        run: |
          tar czf hello-${VERSION}.tar.gz hello

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ env.VERSION }}
          path: hello-${{ env.VERSION }}.tar.gz
          