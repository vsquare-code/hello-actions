name: Every 10 mins Build and Release

on:
  schedule:
    - cron: '*/10 * * * *'   # Testing: every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Generate build version
        run: |
          BASE_VERSION=$(cat VERSION)
          COMMIT_ID=$(git rev-parse --short HEAD)
          BUILD_NUMBER=${{ github.run_number }}

          FULL_VERSION="${BASE_VERSION}-${COMMIT_ID}-${BUILD_NUMBER}"
          TAG_NAME="v${FULL_VERSION}"

          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV


      - name: Display build information
        run: |
          echo "Version      : $BASE_VERSION"
          echo "Commit       : $COMMIT_ID"
          echo "Build Number : $BUILD_NUMBER"
          echo "Full Version : $FULL_VERSION"
          echo "Tag          : $TAG_NAME"


      - name: Compile
        run: |
          gcc hello.c -o hello


      - name: Create archive
        run: |
          tar czf hello-${FULL_VERSION}.tar.gz hello


      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ env.FULL_VERSION }}
          path: hello-${{ env.FULL_VERSION }}.tar.gz
          retention-days: 30


      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag $TAG_NAME
          git push origin $TAG_NAME


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.FULL_VERSION }}
          body: |
            Automated build release

            Application Version : ${{ env.BASE_VERSION }}
            Commit             : ${{ env.COMMIT_ID }}
            Build Number       : ${{ env.BUILD_NUMBER }}

          files: |
            hello-${{ env.FULL_VERSION }}.tar.gz